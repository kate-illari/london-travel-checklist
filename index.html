<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чекліст подорожі — жовтень 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="countdown" id="countdown"></div>
  <h1>✈️ Чекліст подорожі</h1>
  <div class="subtitle">Київ → Будапешт → Лондон → Ньюарк → Лондон → Будапешт → Київ · жовтень 2026</div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="trip" id="tab-trip">🗺️ Маршрут</button>
    <button class="tab" role="tab" data-tab="packing" id="tab-packing">🧳 Речі</button>
    <button class="tab" role="tab" data-tab="calendar" id="tab-calendar">📅 Календар</button>
  </div>

  <div class="panel" id="panel-trip" role="tabpanel">
    <h2 class="print-title">🗺️ Маршрут</h2>
    <div class="progress">
      <strong><span id="count">0</span> / <span id="total">0</span> виконано</strong>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>

    <div id="sections"></div>

    <div class="actions">
      <button onclick="resetAll()">Скинути всі позначки</button>
      <button id="restoreTrip" onclick="restoreTrip()">Повернути видалені етапи</button>
      <button onclick="window.print()">🖨️ Друкувати список</button>
    </div>
  </div>

  <div class="panel" id="panel-packing" role="tabpanel">
    <h2 class="print-title">🧳 Речі</h2>
    <div class="progress">
      <strong><span id="packCount">0</span> / <span id="packTotal">0</span> спаковано</strong>
      <div class="bar"><div class="fill" id="packFill"></div></div>
    </div>

    <div id="packSections"></div>

    <form class="add-form" id="addForm">
      <input type="text" id="newItem" placeholder="Додати свою річ…" autocomplete="off">
      <select id="newItemCat"></select>
      <button type="submit">Додати</button>
    </form>

    <div class="actions">
      <button onclick="resetPacking()">Скинути позначки речей</button>
      <button onclick="window.print()">🖨️ Друкувати список</button>
    </div>
  </div>

  <div class="panel" id="panel-calendar" role="tabpanel">
    <h2 class="print-title">📅 Календар</h2>
    <div id="calDays"></div>

    <div class="actions">
      <button id="restoreDays" onclick="restoreDays()">Повернути видалені дні</button>
      <button onclick="window.print()">🖨️ Друкувати календар</button>
    </div>
  </div>

  <div class="note">Позначки зберігаються автоматично у браузері на цьому пристрої.</div>
</div>

<script src="script.js"></script>
</body>
</html>
