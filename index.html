<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чекліст подорожі — жовтень 2026</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #111318;
    --card: #1b1e25;
    --card-hover: #222630;
    --text: #f1f3f5;
    --muted: #9299a6;
    --border: #2b303a;
    --accent: #8b7cf6;
  }
  * { color-scheme: dark; }
  body {
    margin: 0; padding: 22px 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 760px; margin: auto; }
  .countdown { display:none; background:#ffd43b; color:#111318; border-radius:12px; padding:13px 16px; margin-bottom:12px; text-align:center; font-weight:800; font-size:19px; letter-spacing:.5px; box-shadow:0 3px 14px #ffd43b33; }
  h1 { margin: 0 0 4px; font-size: 25px; }
  .subtitle { color: var(--muted); margin-bottom: 16px; font-size: 13px; }
  .progress {
    background: var(--card); border-radius: 10px; padding: 10px 13px;
    margin-bottom: 10px; border: 1px solid var(--border);
  }
  .bar { height: 6px; background: #303540; border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  .section {
    background: var(--card); border-radius: 11px; padding: 10px 13px;
    margin: 8px 0; border: 1px solid var(--border);
  }
  .section h2 { margin: 0; font-size: 16px; display: inline; }
  .date { color: var(--muted); font-size: 12px; display: inline; margin-left: 8px; }
  label {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 2px; border-top: 1px solid var(--border);
    cursor: pointer; line-height: 1.3; font-size: 14px;
  }
  label:first-of-type { border-top: 0; }
  input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); flex: 0 0 auto; }
  .expense-wrap { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .expense-check { width: 14px; height: 14px; }
  .expense-label { color: var(--muted); }
  .done { text-decoration: line-through; color: #747b88; }
  .actions { display:flex; gap:8px; margin: 12px 0; }
  button {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    background: var(--card); color: var(--muted); cursor:pointer; font-size: 12px;
  }
  button:hover { background: var(--card-hover); color: var(--text); }
  .note { font-size: 11px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="countdown" id="countdown"></div>
  <h1>✈️ Чекліст подорожі</h1>
  <div class="subtitle">Київ → Будапешт → Лондон → Ньюарк → Лондон → Будапешт → Київ · жовтень 2026</div>

  <div class="progress">
    <strong><span id="count">0</span> / <span id="total">0</span> виконано</strong>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="sections"></div>

  <div class="actions">
    <button onclick="resetAll()">Скинути всі позначки</button>
  </div>
  <div class="note">Позначки зберігаються автоматично у браузері на цьому пристрої.</div>
</div>

<script>
function updateCountdown() {
  const target = new Date(2026, 9, 6);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.ceil((target - today) / 86400000);
  const el = document.getElementById("countdown");
  if (diff > 0) {
    el.textContent = `${diff} ${diff === 1 ? "DAY" : "DAYS"} UNTIL DEPARTURE`;
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}
updateCountdown();
setInterval(updateCountdown, 60 * 60 * 1000);

const sections = [
  {
    title: "🇺🇦 Київ → 🇭🇺 Будапешт",
    date: "6 жовтня",
    items: ["Квитки на потяг Київ → Будапешт"]
  },
  {
    title: "🇭🇺 Будапешт",
    date: "7 → 8 жовтня",
    items: ["Готель у Будапешті на ніч 7 → 8 жовтня"]
  },
  {
    title: "🇭🇺 Будапешт → 🇬🇧 Лондон",
    date: "8 жовтня",
    items: ["Квитки на літак Будапешт → Лондон"]
  },
  {
    title: "🇬🇧 Лондон → 🇬🇧 Ньюарк",
    date: "8 жовтня",
    items: ["Квитки на потяг Лондон → Ньюарк", "Готель у Ньюарку на 8 → 10 жовтня"]
  },
  {
    title: "🇬🇧 Ньюарк → Лондон",
    date: "10 жовтня",
    items: ["Квитки на потяг Ньюарк → Лондон", "Готель у Лондоні на 10 → 14 жовтня"]
  },
  {
    title: "🇬🇧 Лондон → 🇭🇺 Будапешт",
    date: "14 жовтня",
    items: ["Квитки на літак Лондон → Будапешт"]
  },
  {
    title: "🇭🇺 Будапешт → 🇺🇦 Київ",
    date: "14 жовтня",
    items: ["Квитки на потяг Будапешт → Київ"]
  }
];

const root = document.getElementById("sections");
const saved = JSON.parse(localStorage.getItem("tripChecklist2026") || "{}");

let idx = 0;
sections.forEach(section => {
  const div = document.createElement("div");
  div.className = "section";
  div.innerHTML = `<h2>${section.title}</h2><div class="date">${section.date}</div>`;
  section.items.forEach(item => {
    const id = "item-" + idx++;
    const label = document.createElement("label");
    const expenseId = id + "-expense";
    const noExpense = item === "Готель у Лондоні на 10 → 14 жовтня";
    label.innerHTML = `<input type="checkbox" id="${id}"><span>${item}</span>` +
      (noExpense ? "" : ` <span class="expense-wrap"><input type="checkbox" id="${expenseId}" class="expense-check"><span class="expense-label">add to expense report</span></span>`);
    const checkbox = label.querySelector(`#${id}`);
    checkbox.checked = !!saved[id];
    if (checkbox.checked) label.querySelector("span").classList.add("done");
    checkbox.addEventListener("change", () => {
      saved[id] = checkbox.checked;
      localStorage.setItem("tripChecklist2026", JSON.stringify(saved));
      const textSpan = label.querySelector(":scope > span");
      if (textSpan) textSpan.classList.toggle("done", checkbox.checked);
      updateProgress();
    });

    if (!noExpense) {
      const expenseCheckbox = label.querySelector(`#${expenseId}`);
      expenseCheckbox.checked = !!saved[expenseId];
      expenseCheckbox.addEventListener("change", () => {
        saved[expenseId] = expenseCheckbox.checked;
        localStorage.setItem("tripChecklist2026", JSON.stringify(saved));
      });
    }
    div.appendChild(label);
  });
  root.appendChild(div);
});

function updateProgress() {
  const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
  const done = boxes.filter(x => x.checked).length;
  document.getElementById("count").textContent = done;
  document.getElementById("total").textContent = boxes.length;
  document.getElementById("fill").style.width = (done / boxes.length * 100) + "%";
}
function resetAll() {
  document.querySelectorAll('input[type="checkbox"]').forEach(x => {
    x.checked = false;
    const span = x.closest("label").querySelector(":scope > span");
    if (span) span.classList.remove("done");
  });
  localStorage.removeItem("tripChecklist2026");
  updateProgress();
}
updateProgress();
</script>
</body>
</html>
